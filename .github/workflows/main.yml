name: SOFA SYMBIOSIS 1 - Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          unzip -q SOFA_SYMBIOSIS_1_source.zip -d .
          test -f SOFA_SYMBIOSIS_1/settings.gradle
          test -f SOFA_SYMBIOSIS_1/app/build.gradle

      - name: Build APK
        working-directory: SOFA_SYMBIOSIS_1
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOFA-SYMBIOSIS-1-APK
          path: SOFA_SYMBIOSIS_1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload extracted source for verification
        uses: actions/upload-artifact@v4
        with:
          name: SOFA-SYMBIOSIS-1-SOURCE
          path: SOFA_SYMBIOSIS_1/
          if-no-files-found: error
          retention-days: 7
