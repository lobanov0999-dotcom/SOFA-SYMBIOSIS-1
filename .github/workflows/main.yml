name: SOFA SYMBIOSIS 1 - Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          unzip -q SOFA_SYMBIOSIS_1_source.zip -d .
          test -f SOFA_SYMBIOSIS_1/settings.gradle
          test -f SOFA_SYMBIOSIS_1/app/build.gradle
          grep -q "org.jetbrains.kotlin.android" SOFA_SYMBIOSIS_1/build.gradle
          grep -q "org.jetbrains.kotlin.android" SOFA_SYMBIOSIS_1/app/build.gradle

      - name: Run unit tests and build APK
        working-directory: SOFA_SYMBIOSIS_1
        run: |
          gradle --no-daemon clean testDebugUnitTest assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          DEX_COUNT=$(unzip -Z1 "$APK" | grep -Ec '^classes([0-9]+)?\.dex$')
          test "$DEX_COUNT" -ge 1
          echo "APK verified: $DEX_COUNT DEX file(s)"

      - name: Verify APK signature
        working-directory: SOFA_SYMBIOSIS_1
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOFA-SYMBIOSIS-1-APK
          path: SOFA_SYMBIOSIS_1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package clean source
        run: |
          cd SOFA_SYMBIOSIS_1
          zip -qr ../SOFA-SYMBIOSIS-1-SOURCE.zip . -x '*/build/*' '*/.gradle/*' '*.iml'

      - name: Upload clean source
        uses: actions/upload-artifact@v4
        with:
          name: SOFA-SYMBIOSIS-1-SOURCE
          path: SOFA-SYMBIOSIS-1-SOURCE.zip
          if-no-files-found: error
          retention-days: 14
