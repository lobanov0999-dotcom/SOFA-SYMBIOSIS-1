name: SOFA SYMBIOSIS 1 - Android APK

on:
  push:
    branches: [main, work/sofa-foundation-2026-11-25]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          unzip -q SOFA_SYMBIOSIS_1_source.zip -d .
          test -f SOFA_SYMBIOSIS_1/settings.gradle
          test -f SOFA_SYMBIOSIS_1/app/build.gradle

      - name: Apply maintained gateway source overlay
        run: |
          APP="SOFA_SYMBIOSIS_1/app"
          PKG="$APP/src/main/java/com/sofa/symbiosis/gateway"
          TEST="$APP/src/test/java/com/sofa/symbiosis/gateway"
          mkdir -p "$PKG" "$TEST"
          cp engineering/android/CapabilityGate.kt "$PKG/CapabilityGate.kt"
          cp engineering/android/LocalGateway.kt "$PKG/LocalGateway.kt"
          cp engineering/android/CoreChangeApprovalGate.kt "$PKG/CoreChangeApprovalGate.kt"
          cp engineering/android/CapabilityGateTest.kt "$TEST/CapabilityGateTest.kt"
          cp engineering/android/LocalGatewayTest.kt "$TEST/LocalGatewayTest.kt"
          cp engineering/android/CoreChangeApprovalGateTest.kt "$TEST/CoreChangeApprovalGateTest.kt"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("SOFA_SYMBIOSIS_1/app/build.gradle")
          text = p.read_text()
          dep = "    testImplementation 'junit:junit:4.13.2'"
          if dep not in text:
              text += "\n\ndependencies {\n" + dep + "\n}\n"
              p.write_text(text)
          PY

      - name: Normalize Kotlin and Java build settings
        working-directory: SOFA_SYMBIOSIS_1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("build.gradle")
          text = root.read_text()
          if "org.jetbrains.kotlin.android" not in text:
              pattern = r"(id\s+['\"]com\.android\.application['\"]\s+version\s+['\"][^'\"]+['\"]\s+apply\s+false)"
              text, count = re.subn(pattern, r"\1\n    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false", text, count=1)
              if count != 1:
                  raise SystemExit("Could not safely add Kotlin plugin to root build.gradle")
              root.write_text(text)

          app = Path("app/build.gradle")
          text = app.read_text()
          if "org.jetbrains.kotlin.android" not in text:
              match = re.search(r"plugins\s*\{([^}]*)\}", text, re.S)
              if not match:
                  raise SystemExit("Could not find app plugins block")
              body = match.group(1).rstrip()
              text = text[:match.start(1)] + body + "\n    id 'org.jetbrains.kotlin.android'" + text[match.end(1):]
          if "sourceCompatibility JavaVersion.VERSION_17" not in text:
              text += """

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          """
          app.write_text(text)
          PY

      - name: Run unit tests and build APK
        working-directory: SOFA_SYMBIOSIS_1
        run: |
          gradle --no-daemon clean testDebugUnitTest assembleDebug
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          executed = sum(int(ET.parse(p).getroot().attrib.get("tests", "0")) for p in reports)
          failures = sum(int(ET.parse(p).getroot().attrib.get("failures", "0")) + int(ET.parse(p).getroot().attrib.get("errors", "0")) for p in reports)
          print(f"Unit tests executed: {executed}; failures/errors: {failures}")
          if executed < 10 or failures:
              raise SystemExit("Expected at least 10 passing gateway unit tests")
          PY
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          DEX_COUNT=$(unzip -Z1 "$APK" | grep -Ec '^classes([0-9]+)?\.dex$')
          test "$DEX_COUNT" -ge 1
          echo "APK verified: $DEX_COUNT DEX file(s)"

      - name: Verify APK signature
        working-directory: SOFA_SYMBIOSIS_1
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOFA-SYMBIOSIS-1-APK
          path: SOFA_SYMBIOSIS_1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package clean source
        run: |
          cd SOFA_SYMBIOSIS_1
          zip -qr ../SOFA-SYMBIOSIS-1-SOURCE.zip . -x '*/build/*' '*/.gradle/*' '*.iml'

      - name: Upload clean source
        uses: actions/upload-artifact@v4
        with:
          name: SOFA-SYMBIOSIS-1-SOURCE
          path: SOFA-SYMBIOSIS-1-SOURCE.zip
          if-no-files-found: error
          retention-days: 14
